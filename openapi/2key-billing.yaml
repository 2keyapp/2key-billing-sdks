openapi: 3.0.3
info:
  title: 2key Billing API (client SDK surface)
  version: 0.1.0
  description: |
    Public client routes used by 2key SDKs. Auth is via Better Auth at `/api/auth/*`
    (see docs/auth-protocol.md). This document covers `/api/v1` only.
servers:
  - url: https://billing.example.com
paths:
  /api/v1/license:
    get:
      operationId: getLicense
      summary: Fetch signed license JWT for the authenticated using-party
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: Stored ETag from a previous license response
        - name: X-Paying-Party-Id
          in: header
          schema:
            type: string
          description: Optional paying-party override
      responses:
        "200":
          description: License issued or refreshed
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signedToken:
                        type: string
                        description: ES256 license JWT
                      signed_token:
                        type: string
                      token:
                        type: string
        "304":
          description: Not modified (ETag match)
        "401":
          description: Unauthorized
  /api/v1/license/devices:
    get:
      operationId: listLicenseDevices
      summary: List bound app_client devices for the caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assigned seats and bound devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [seats]
                    properties:
                      seats:
                        type: array
                        items:
                          $ref: "#/components/schemas/LicenseDeviceSeat"
        "401":
          description: Unauthorized
    post:
      operationId: bindLicenseDevice
      summary: Bind a license device public key
      description: |
        Registers an Ed25519 `publicJwk` (RFC 7638 SKI) on an assigned human seat.
        Pass `replaceSki` when at `maxDevices`. Set `issueLicense` to include a
        fresh license JWT in the same response. HTTP 409 `DEVICE_LIMIT_REACHED`
        when the seat is full.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindLicenseDeviceRequest"
      responses:
        "200":
          description: Device bound
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BindLicenseDeviceResult"
        "400":
          description: Missing publicJwk
        "401":
          description: Unauthorized
        "409":
          description: DEVICE_LIMIT_REACHED
  /api/v1/license/devices/{ski}:
    delete:
      operationId: revokeLicenseDevice
      summary: Revoke a bound app_client device
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ski
          required: true
          schema:
            type: string
          description: RFC 7638 JWK thumbprint
        - in: query
          name: deviceId
          schema:
            type: string
        - in: query
          name: subscriptionId
          schema:
            type: string
      responses:
        "200":
          description: Device revoked
        "401":
          description: Unauthorized
        "404":
          description: Device not found
  /api/auth/sign-in/email:
    post:
      operationId: signInEmail
      summary: Email/password sign-in (Better Auth session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Session established (Set-Cookie)
        "401":
          description: Invalid credentials
  /api/auth/sign-up/email:
    post:
      operationId: signUpEmail
      summary: Email/password registration (Better Auth session cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
      responses:
        "200":
          description: User created and session established
        "201":
          description: User created
  /api/auth/token:
    get:
      operationId: acquireApiToken
      summary: Mint billing API JWT from the auth session
      responses:
        "200":
          description: Bearer token for /api/v1
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      token:
                        type: string
                      accessToken:
                        type: string
        "401":
          description: No session
  /api/auth/.well-known/oauth-providers:
    get:
      operationId: listOAuthProviders
      summary: Discover enabled login methods
      responses:
        "200":
          description: Provider list for login UI
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /api/v1/subscriptions/me:
    get:
      operationId: getSubscriptionsMe
      summary: Bootstrap billing context for the authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing summary (shape may wrap under data)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
  /api/v1/plans:
    get:
      operationId: listPlans
      summary: Public plan catalog
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: billingInterval
          in: query
          schema:
            type: string
            enum: [monthly, annual]
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plan list (data[] or items[])
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
  /api/v1/usage/report:
    post:
      operationId: reportUsage
      summary: Ingest a usage event (reporter / M2M — not end-user session)
      description: |
        Live server path used by relays and machine reporters.
        Auth is `USAGE_REPORTER_TOKEN` (Bearer), not a user billing JWT.
        mTLS enrollment APIs are not yet public; see architecture Phase 6.
      security:
        - reporterBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageReportRequest"
      responses:
        "200":
          description: Accepted (or duplicate idempotency key)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UsageReportResult"
        "400":
          description: Missing required fields
        "401":
          description: Invalid reporter token
  /api/v1/machine-authn/register:
    post:
      operationId: registerMachineAuthn
      summary: Register Org Root CA + host cosign on a paying party
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMachineAuthnRequest"
      responses:
        "201":
          description: Machine AuthN registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
        "401":
          description: Unauthorized
  /api/v1/machine-authn/enroll-create:
    post:
      operationId: enrollCreate
      summary: Create a pending device enrollment (CSR + pull token)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollCreateRequest"
      responses:
        "201":
          description: Enrollment created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnrollCreateResponse"
  /api/v1/machine-authn/enroll-approve:
    post:
      operationId: enrollApprove
      summary: Approve pending enroll; allocate machine seat when kind is machine_*
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollApproveRequest"
      responses:
        "200":
          description: Enrollment approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /api/v1/machine-authn/enroll-pull:
    post:
      operationId: enrollPull
      summary: Device pulls approved enrollment materials (pullToken auth; no JWT)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollPullRequest"
      responses:
        "200":
          description: Pending or approved enrollment state
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/EnrollPullResponse"
  /api/v1/machine-authn/enroll-invite:
    post:
      operationId: enrollInviteCreate
      summary: Append a machine enroll invite on the paying party
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollInviteCreateRequest"
      responses:
        "201":
          description: Invite created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
    get:
      operationId: getEnrollInvite
      summary: Preview invite without consuming a use (no JWT)
      parameters:
        - name: payingPartyId
          in: query
          required: true
          schema:
            type: string
        - name: inviteToken
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invite metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /api/v1/machine-authn/issue-delegate:
    post:
      operationId: issueDelegate
      summary: Issue interim_admin / zone_authority child device
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueDelegateRequest"
      responses:
        "200":
          description: Delegate issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /api/v1/machine-authn/assert-subset:
    post:
      operationId: assertSubset
      summary: Check child capability set is subset of parent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertSubsetRequest"
      responses:
        "200":
          description: Subset check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ok:
                        type: boolean
  /api/v1/machine-authn/platform-root:
    get:
      operationId: platformRoot
      summary: Host (platform) public JWK for cosign verification
      responses:
        "200":
          description: Platform root JWK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /api/v1/machine-authn/credential-status:
    get:
      operationId: credentialStatus
      summary: Credential lifecycle status by SKI
      security:
        - bearerAuth: []
      parameters:
        - name: ski
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Credential status
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: true
  /api/v1/machine-authn/enroll-list:
    get:
      operationId: enrollList
      summary: List pending enrollments (forward-compatible; not on all servers)
      x-sdk-forward: true
      security:
        - bearerAuth: []
      parameters:
        - name: entityId
          in: query
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Enrollment list
  /api/v1/machine-authn/machine-renew:
    post:
      operationId: machineRenew
      summary: Renew machine credential (forward-compatible)
      x-sdk-forward: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Renewed credential
  /api/auth/agent/token:
    post:
      operationId: mintAgentToken
      summary: Mint Target Agent entitlement JWT (Better Auth host, not /api/v1)
      servers:
        - url: https://billing.example.com
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTokenMintRequest"
      responses:
        "200":
          description: Agent token minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: "#/components/schemas/AgentTokenMintResponse"
        "401":
          description: Invalid credential or proof
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    reporterBearer:
      type: http
      scheme: bearer
      description: USAGE_REPORTER_TOKEN (or auth secret fallback on server)
  schemas:
    UsageReportRequest:
      type: object
      required: [meter_key, using_party, paying_party, idempotency_key]
      properties:
        meter_key:
          type: string
        meterKey:
          type: string
        using_party:
          type: string
        usingParty:
          type: string
        paying_party:
          type: string
        payingParty:
          type: string
        idempotency_key:
          type: string
        idempotencyKey:
          type: string
        reporter_type:
          type: string
          default: relay
        quantity:
          oneOf:
            - type: string
            - type: number
        dimensions:
          type: object
          additionalProperties: true
    UsageReportResult:
      type: object
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
        remaining:
          type: string
          nullable: true
        generation:
          type: integer
          nullable: true
        actions:
          type: array
          items:
            type: string
    LicenseDeviceSummary:
      type: object
      required: [deviceId, ski, platform]
      properties:
        deviceId:
          type: string
        ski:
          type: string
        platform:
          type: string
          enum: [web, ios, android, desktop, unknown]
        friendlyName:
          type: string
        createdAt:
          type: string
          format: date-time
    LicenseDeviceSeat:
      type: object
      required: [subscriptionId, memberId, planId, maxDevices, devices]
      properties:
        subscriptionId:
          type: string
        memberId:
          type: string
        planId:
          type: string
        planName:
          type: string
        addonCode:
          type: string
        maxDevices:
          type: integer
        devices:
          type: array
          items:
            $ref: "#/components/schemas/LicenseDeviceSummary"
    BindLicenseDeviceRequest:
      type: object
      required: [publicJwk]
      properties:
        publicJwk:
          type: object
          additionalProperties: true
        friendlyName:
          type: string
        subscriptionId:
          type: string
        platform:
          type: string
          enum: [web, ios, android, desktop, unknown]
        replaceSki:
          type: string
        issueLicense:
          type: boolean
    BindLicenseDeviceResult:
      type: object
      required: [device, seat]
      properties:
        device:
          $ref: "#/components/schemas/LicenseDeviceSummary"
        seat:
          $ref: "#/components/schemas/LicenseDeviceSeat"
        replacedSki:
          type: string
        signedToken:
          type: string
    Plan:
      type: object
      required: [id, name, billing_interval, base_price, currency]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        productId:
          type: integer
        name:
          type: string
        description:
          type: string
        billing_interval:
          type: string
        billingInterval:
          type: string
        base_price:
          type: number
        basePrice:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        features_json:
          type: object
          additionalProperties: true
        addon_code:
          type: string
        addonCode:
          type: string
        is_active:
          type: boolean
        isActive:
          type: boolean
    LicenseClaims:
      type: object
      description: Decoded ES256 license JWT payload (see conformance/fixtures)
      required: [payload_version, paying_party, subscriptions]
      properties:
        payload_version:
          type: integer
        iss:
          type: string
        aud:
          type: string
        iat:
          type: integer
        exp:
          type: integer
        paying_party:
          type: object
          required: [id, billing_email]
          properties:
            id:
              type: string
            identity_provider:
              type: string
            identity_subject:
              type: string
            billing_email:
              type: string
            organization_name:
              type: string
        subscriptions:
          type: array
          items:
            type: object
            required:
              - subscription_id
              - plan_id
              - product_id
              - plan_name
              - product_name
              - subscription_status
              - valid_until
            properties:
              subscription_id:
                type: string
              plan_id:
                type: string
              product_id:
                type: string
              plan_name:
                type: string
              product_name:
                type: string
              subscription_status:
                type: string
              valid_until:
                type: integer
              valid_from:
                type: integer
              billing_interval:
                type: string
              addon_code:
                type: string
              using_party_identity_provider:
                type: string
              using_party_identity_subject:
                type: string
              using_party_email:
                type: string
              assigned_user_party_id:
                type: string
    RegisterMachineAuthnRequest:
      type: object
      required: [payingPartyId, memberId, entityId, package, rootSki, caCertPem]
      properties:
        payingPartyId:
          type: string
        memberId:
          type: string
        entityId:
          type: string
        package:
          type: string
          enum: [personal, enterprise]
        rootSki:
          type: string
        caCertPem:
          type: string
        rootCredential:
          type: object
          additionalProperties: true
    EnrollCreateRequest:
      type: object
      required: [payingPartyId, memberId, csrPem]
      properties:
        payingPartyId:
          type: string
        memberId:
          type: string
        kind:
          type: string
          enum: [machine_target, machine_source, root_admin, interim_admin, zone_authority]
        host:
          type: string
        zone:
          type: string
        csrPem:
          type: string
        publicJwk:
          type: object
          additionalProperties: true
        subjectSki:
          type: string
        inviteToken:
          type: string
        platform:
          type: string
    EnrollCreateResponse:
      type: object
      required: [enrollId, pullToken, subjectSki, status]
      properties:
        enrollId:
          type: string
          format: uuid
        pullToken:
          type: string
        subjectSki:
          type: string
        kind:
          type: string
        status:
          type: string
          enum: [pending]
    EnrollApproveRequest:
      type: object
      required: [enrollId, memberId, leafPem, chainPem, credential, issuerSki]
      properties:
        enrollId:
          type: string
          format: uuid
        memberId:
          type: string
        leafPem:
          type: string
        chainPem:
          type: string
        credential:
          type: object
          additionalProperties: true
        issuerSki:
          type: string
    EnrollPullRequest:
      type: object
      required: [pullToken]
      properties:
        pullToken:
          type: string
    EnrollPullResponse:
      type: object
      required: [status, enrollId]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
        enrollId:
          type: string
        host:
          type: string
        zone:
          type: string
        kind:
          type: string
        ski:
          type: string
        publicJwk:
          type: object
        certPem:
          type: string
        chainPem:
          type: string
        credential:
          type: object
        hostCertCosign:
          type: object
        seatId:
          type: string
          nullable: true
    EnrollInviteCreateRequest:
      type: object
      required: [payingPartyId, memberId]
      properties:
        payingPartyId:
          type: string
        memberId:
          type: string
        kind:
          type: string
          enum: [machine_target, machine_source]
        expiresInSeconds:
          type: integer
        maxUses:
          type: integer
    IssueDelegateRequest:
      type: object
      required: [payingPartyId, memberId, issuerSki, kind, credential]
      properties:
        payingPartyId:
          type: string
        memberId:
          type: string
        issuerSki:
          type: string
        kind:
          type: string
          enum: [interim_admin, zone_authority]
        credential:
          type: object
        zone:
          type: string
        platform:
          type: string
    AssertSubsetRequest:
      type: object
      required: [child, parent]
      properties:
        child:
          type: array
          items:
            type: object
        parent:
          type: array
          items:
            type: object
        catalog:
          type: object
    AgentTokenMintRequest:
      type: object
      required: [credential, proof, targetIdentity]
      properties:
        credential:
          type: object
          additionalProperties: true
        proof:
          type: object
          required: [ts, signature]
          properties:
            ts:
              type: integer
            signature:
              type: string
        targetIdentity:
          type: string
    AgentTokenMintResponse:
      type: object
      required: [token, expiresIn]
      properties:
        token:
          type: string
        expiresIn:
          type: integer
        token_type:
          type: string
