openapi: 3.0.3
info:
  title: 2key Billing API (client SDK surface)
  version: 0.1.0
  description: |
    Public client routes used by 2key SDKs. Auth is via Better Auth at `/api/auth/*`
    (see docs/auth-protocol.md). This document covers `/api/v1` only.
servers:
  - url: https://billing.example.com
paths:
  /api/v1/license:
    get:
      operationId: getLicense
      summary: Fetch signed license JWT for the authenticated using-party
      security:
        - bearerAuth: []
      parameters:
        - name: If-None-Match
          in: header
          schema:
            type: string
          description: Stored ETag from a previous license response
        - name: X-Paying-Party-Id
          in: header
          schema:
            type: string
          description: Optional paying-party override
      responses:
        "200":
          description: License issued or refreshed
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      signedToken:
                        type: string
                        description: ES256 license JWT
                      signed_token:
                        type: string
                      token:
                        type: string
        "304":
          description: Not modified (ETag match)
        "401":
          description: Unauthorized
  /api/v1/subscriptions/me:
    get:
      operationId: getSubscriptionsMe
      summary: Bootstrap billing context for the authenticated identity
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billing summary (shape may wrap under data)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
  /api/v1/plans:
    get:
      operationId: listPlans
      summary: Public plan catalog
      parameters:
        - name: productId
          in: query
          schema:
            type: integer
        - name: billingInterval
          in: query
          schema:
            type: string
            enum: [monthly, annual]
        - name: includeInactive
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Plan list (data[] or items[])
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Plan"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Plan:
      type: object
      required: [id, name, billing_interval, base_price, currency]
      properties:
        id:
          type: integer
        product_id:
          type: integer
        productId:
          type: integer
        name:
          type: string
        description:
          type: string
        billing_interval:
          type: string
        billingInterval:
          type: string
        base_price:
          type: number
        basePrice:
          type: number
        currency:
          type: string
        features:
          type: array
          items:
            type: string
        features_json:
          type: object
          additionalProperties: true
        addon_code:
          type: string
        addonCode:
          type: string
        is_active:
          type: boolean
        isActive:
          type: boolean
    LicenseClaims:
      type: object
      description: Decoded ES256 license JWT payload (see conformance/fixtures)
      required: [payload_version, paying_party, subscriptions]
      properties:
        payload_version:
          type: integer
        iss:
          type: string
        aud:
          type: string
        iat:
          type: integer
        exp:
          type: integer
        paying_party:
          type: object
          required: [id, billing_email]
          properties:
            id:
              type: string
            identity_provider:
              type: string
            identity_subject:
              type: string
            billing_email:
              type: string
            organization_name:
              type: string
        subscriptions:
          type: array
          items:
            type: object
            required:
              - subscription_id
              - plan_id
              - product_id
              - plan_name
              - product_name
              - subscription_status
              - valid_until
            properties:
              subscription_id:
                type: string
              plan_id:
                type: string
              product_id:
                type: string
              plan_name:
                type: string
              product_name:
                type: string
              subscription_status:
                type: string
              valid_until:
                type: integer
              valid_from:
                type: integer
              billing_interval:
                type: string
              addon_code:
                type: string
              using_party_identity_provider:
                type: string
              using_party_identity_subject:
                type: string
              using_party_email:
                type: string
              assigned_user_party_id:
                type: string
