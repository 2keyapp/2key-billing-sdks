name: two_key_dart_sdk
description: 2key Billing Dart/Flutter SDK (canonical; replaces billing_dart_sdk)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  dart_jsonwebtoken: ^3.2.0
  ffi: ^2.1.3
  http: ^1.2.0
  # Internal only — host apps must depend on two_key_dart_sdk, never better_auth.
  # After better-auth Phase 5 is on main: path packages/clients/dart + new SHA.
  better_auth:
    git:
      url: https://github.com/2keyapp/better-auth.git
      ref: 51f3efecbd5fa87d9d6222ee2e1c17137edc879b
      path: packages/flutter/dart
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - keys/billing_public.pem
