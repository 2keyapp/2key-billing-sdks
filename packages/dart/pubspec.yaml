name: two_key_dart_sdk
description: 2key Billing Dart/Flutter SDK (canonical; replaces billing_dart_sdk)
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  cryptography: ^2.7.0
  ffi: ^2.1.3
  flutter_rust_bridge: 2.11.1
  http: ^1.2.0
  # Internal only — host apps must depend on two_key_dart_sdk, never better_auth.
  better_auth:
    git:
      url: https://github.com/2keyapp/better-auth.git
      ref: 9c90915c3ce257e6915d3a9bc3400e5cc163e9ac
      path: packages/clients/dart
  flutter_secure_storage: ^9.2.4
  dart_jsonwebtoken: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - keys/billing_public.pem
