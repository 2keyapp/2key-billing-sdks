name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  cli-fetch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch scripts present
        run: |
          test -f scripts/fetch-binaries.sh
          test -f scripts/fetch-binaries.ps1
          test -f core-binaries.lock.json
          test -f docs/cli.md

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter tests
        working-directory: packages/dart
        run: |
          flutter pub get
          flutter test
