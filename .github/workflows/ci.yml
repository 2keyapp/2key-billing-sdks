name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Both language jobs always run. Shared OpenAPI / conformance changes
# must stay green in Dart and JavaScript together.

jobs:
  cli-fetch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch scripts present
        run: |
          test -f scripts/fetch-binaries.sh
          test -f scripts/fetch-binaries.ps1
          test -f core-binaries.lock.json
          test -f docs/cli.md
          test -f openapi/2key-billing.yaml
          test -f conformance/fixtures/license_payload_v3.json
          test -f conformance/dp-authz/fixtures.json
          test ! -e Cargo.toml
          test ! -d crates/billing_http

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter tests
        working-directory: packages/dart
        run: |
          flutter pub get
          flutter test

  javascript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/javascript
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: packages/javascript/pnpm-lock.yaml
      - run: pnpm install
      - run: pnpm run ci
