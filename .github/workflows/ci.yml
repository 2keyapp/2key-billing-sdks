name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test two-key-core
        run: cargo test -p two-key-core
      - name: Build CLI
        run: cargo build -p two-key-cli

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npm run build

  dart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build two-key-core cdylib
        run: cargo build -p two-key-core
      - uses: dart-lang/setup-dart@v1
      - name: Dart tests
        working-directory: packages/dart
        run: |
          dart pub get
          dart test
        env:
          TWOKEY_CORE_LIB: ${{ github.workspace }}/target/debug/libtwo_key_core.so
